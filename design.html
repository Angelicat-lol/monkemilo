<!DOCTYPE html>
<html>
<head>
    <title>monke.milo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="/assets/images/milo.svg" />
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.0.1/model-viewer.min.js"></script>
    <style>
        * {
            cursor: url("assets/images/Wii Cursor.cur"), auto;
            cursor: url("assets/images/Wii Cursor.cur"), pointer;
            cursor: url("assets/images/Wii Cursor.cur"), default !important;
            box-sizing: border-box; 
        }     
        body { margin: 0; padding: 0; font-family: sans-serif; background-color: #f5f5f5; }
        
        #display-container { 
            width: 100%; 
            max-width: 600px; 
            margin: 2rem auto; 
            position: relative; 
            height: 500px;      
        }

        model-viewer, #poster-img, #video-display { 
            position: absolute; 
            top: 0;
            left: 0;
            width: 100%; 
            height: 100%; 
            transition: opacity 0.5s ease;
            border-radius: 2rem; 
            border: 8px solid white; 
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            opacity: 0;
            pointer-events: none;
        }
        #video-display { object-fit: cover; background: black; }    
        #poster-img { object-fit: contain; background: white; }

        .controls { display: flex; justify-content: center; gap: 1rem; margin-top: 1rem; }
        
        .button {
            width: 150px; text-align: center; border-radius: 2rem; display: inline-block;
            padding: 1rem; position: relative; overflow: hidden; z-index: 1;
            text-decoration: none; color: #222; box-shadow: 2px 2px 10px 2px rgba(0, 0, 0, 0.08);
            border: 2.6px solid skyblue; background: #dae3e5; cursor: pointer;
        }
        .button:before {
            content: ""; width: 94%; left: 0; top: 0px; border-radius: 2rem;
            height: 40%; background: #ebecee; position: absolute;
        }
        .button:after {
            content: ""; width: 54%; left: 0; top: 0px; border-radius: 2rem;
            height: 100%; background: #ebecee; position: absolute;
        }
        @font-face {
            font-family: 'WiiFont';
            src: url('fonts/contm.ttf') format('truetype'); 
        }
        .text { position: relative; z-index: 1; font-family: 'WiiFont'; }
    </style>
</head>
<body>

    <main>
        <section id="portfolio">
            <div id="display-container">
                <model-viewer id="viewer" src="" camera-controls auto-rotate shadow-intensity="1"></model-viewer>
                <img id="poster-img" src="">
                <video id="video-display" src="" loop muted playsinline></video>
            </div>
            
            <div class="controls">
                <button id="prev-design" class="button"><span class="text">Prev</span></button>
                <a href="index.html" class="button"><span class="text">Home</span></a>
                <button id="next-design" class="button"><span class="text">Next</span></button>
            </div>
            <audio id="click-sound" src="assets/audios/click.wav"></audio>
        </section>
    </main>

<script>
    const collection = [
        { type: '2d', src: 'assets/posters/2.png' },
        { type: '2d', src: 'assets/posters/3.png' }, 
        { type: '2d', src: 'assets/posters/5.png' }, 
        { type: '2d', src: 'assets/posters/9.png' }, 
        { type: '2d', src: 'assets/posters/10.png' }, 
        { type: '2d', src: 'assets/posters/32.png' }, 
        { type: '2d', src: 'assets/posters/35.png' }, 
        { type: '2d', src: 'assets/posters/37.png' }, 
        { type: '2d', src: 'assets/posters/39.png' }, 
        { type: '2d', src: 'assets/posters/42.png' }, 
        { type: '3d', src: 'assets/blenders/miloonbeach1.glb' },
        { type: '3d', src: 'assets/blenders/miloonbeach.glb' },
        { type: '3d', src: 'assets/blenders/trinket.glb' },
        { type: '2d', src: "assets/posters/_ Matcha ver ~.jpg"},
        { type: 'mp4', src:'assets/posters/peachmatch.mp4'}
    ];

    let currentIndex = 0;
    const viewer = document.getElementById('viewer');
    const poster = document.getElementById('poster-img');
    const clickSound = document.getElementById('click-sound');

const video = document.getElementById('video-display');

function updateDisplay() {
    const item = collection[currentIndex];
    
    // Hide everything first
    viewer.style.opacity = 0; viewer.style.pointerEvents = 'none';
    poster.style.opacity = 0; poster.style.pointerEvents = 'none';
    video.style.opacity = 0;  video.style.pointerEvents = 'none';
    video.pause(); // Always pause the video when switching away

    if (item.type === '3d') {
        viewer.src = item.src;
        viewer.style.opacity = 1;
        viewer.style.pointerEvents = 'auto';
    } 
    else if (item.type === 'mp4') {
        video.src = item.src;
        video.style.opacity = 1;
        video.style.pointerEvents = 'auto';
        video.play();
    }
    else { 
        poster.src = item.src;
        poster.style.opacity = 1;
        poster.style.pointerEvents = 'auto';
    }
}
    document.getElementById('next-design').addEventListener('click', () => {
        clickSound.play();
        currentIndex = (currentIndex + 1) % collection.length;
        updateDisplay();
    });

    document.getElementById('prev-design').addEventListener('click', () => {
        clickSound.play();
        currentIndex = (currentIndex - 1 + collection.length) % collection.length;
        updateDisplay();
    });

    document.querySelectorAll(".button").forEach(btn => {
        btn.addEventListener("mouseenter", () => {
            clickSound.currentTime = 0;
            clickSound.play();
        });
    });

    // Start
    updateDisplay();
</script>

</body>
</html>
